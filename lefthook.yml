---
remotes:
  - git_url: git@github.com:mailerlite/git-hooks.git
    ref: main
    configs:
      - branch-validation-config.yml

pre-commit:
  parallel: true
  commands:
    ruff:
      glob: "*.py"
      run: ruff format .
    secrets:
      run: |
        git secrets --list | grep -q 'mssp' || {
          git secrets --register-aws
          git secrets --add 'mlsn\.[A-Za-z0-9._-]+'
          git secrets --add 'mssp\.[A-Za-z0-9._-]+'
        }
        git secrets --scan {staged_files}
