[project]
name = "mailersend"
dynamic = ["version"]
description = "The official MailerLite Python SDK"
authors = [{name = "MailerLite", email = "tech@mailerlite.com"}]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.1",
    "pydantic[email]>=2.11.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "black>=26.0.0",
    "coverage>=7.0.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.10.0",
    "python-dotenv>=0.21.0",
    "vcrpy>=8.0.0",
    "pre-commit>=2.12.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The git tag is the only source of the version. The publish workflow sets
# SETUPTOOLS_SCM_PRETEND_VERSION from the tag.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"

[tool.ruff]
line-length = 88

[tool.ruff.format]
# black-compatible defaults
